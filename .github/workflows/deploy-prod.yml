name: Deploy to production

on:
  push:
    branches: [master]
  workflow_dispatch: {}

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PROD_SSH_KEY }}" > ~/.ssh/prod_key
          chmod 600 ~/.ssh/prod_key
          ssh-keyscan -H "${{ vars.PROD_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy over SSH
        run: |
          ssh -i ~/.ssh/prod_key "${{ vars.PROD_USER }}@${{ vars.PROD_HOST }}" '
            set -euo pipefail
            cd ~/day-planner/Productivity-Backend
            git fetch origin master
            git reset --hard origin/master
            npm ci
            npx prisma generate
            npx prisma migrate deploy
            npm run build
            pm2 restart day-planner-backend
            pm2 save
          '
